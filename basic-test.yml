config:
  target: 'http://localhost:3001' # <-- 여기에 테스트할 서비스 URL을 입력하세요.
  phases:
    - duration: 60
      arrivalRate: 10
  variables:
    id: '10'
scenarios:
  - name: '영화 목록 조회 및 상세 조회 및 리뷰 작성'
    flow:
      - get:
          url: '/movies' # ✅ 들여쓰기 수정

      - get:
          url: '/movies/{{ id }}' # ✅ 들여쓰기 수정

